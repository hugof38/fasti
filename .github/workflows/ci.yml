name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stable plus the MSRV declared in Cargo.toml.
        toolchain: [stable, "1.90"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # --locked throughout: Cargo.lock is committed so that the MSRV job
      # tests a resolution that is known to build on 1.90. Without it a
      # dependency raising its own MSRV turns this job red for reasons
      # unrelated to the change under test.
      - run: cargo test --locked --all-features --all-targets
      # Doctests are not covered by --all-targets.
      - run: cargo test --locked --all-features --doc

  # The committed lockfile pins one resolution; this proves the declared
  # version requirements still work when dependencies float, so the lock
  # is never quietly load-bearing.
  test-unlocked:
    name: test (updated dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update
      - run: cargo test --all-features --all-targets

  test-non-utc:
    name: test (non-UTC timezone)
    runs-on: ubuntu-latest
    env:
      # The library has no clock and no timezone handling, so results
      # must be identical in any environment timezone. Keep it honest
      # with a timezone that is ahead of UTC and observes DST.
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features --all-targets

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A bare-metal target has no std at all, so this proves the
      # #![no_std] claim for both feature sets.
      - run: cargo check --locked --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check --locked --target thumbv7em-none-eabihf --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --all-features --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # Proves the crate is publishable from a clean checkout: that the
  # packaged file list compiles on its own, and that LICENSE-APACHE,
  # LICENSE-MIT and THIRD-PARTY-NOTICES are actually inside the .crate
  # rather than only in the repository.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - name: License and notice files are in the package
        run: |
          set -euo pipefail
          list=$(cargo package --locked --list)
          for f in LICENSE-APACHE LICENSE-MIT THIRD-PARTY-NOTICES; do
            echo "$list" | grep -qx "$f" || { echo "::error::$f missing from packaged crate"; exit 1; }
          done

  # ---- Python bindings -------------------------------------------------
  #
  # `bindings/python` is its own cargo workspace, so none of the jobs
  # above see it: pyo3 must not reach the core crate's lockfile, MSRV
  # job, or `cargo deny` run.

  python-lint:
    name: python bindings (rustfmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  python:
    name: python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          # The abi3 floor. A wheel built against it runs on every later
          # CPython, so this is the version that has to work.
          python-version: "3.10"
      - run: pip install . pytest mypy
      # Import from the installed wheel, not the source tree, so the
      # tests exercise what a user gets.
      - run: pytest tests -q
      - run: mypy python/fasti

  python-sdist:
    name: python bindings (from sdist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install maturin pytest
      # The sdist has to carry the core crate as well as the binding, or
      # `pip install fasti` fails for anyone without a wheel. Build it and
      # install from it rather than from the working tree.
      - run: maturin sdist --out dist
      - run: pip install dist/*.tar.gz
      - run: pytest tests -q

  # One wheel per platform is supposed to serve every Python from the
  # abi3 floor upwards. That is a claim about a build, so it gets built
  # once and then run everywhere it claims to work — and audited, since
  # nothing at install time checks that an abi3-tagged wheel really only
  # touches the stable ABI.
  python-abi3:
    name: python bindings (one wheel, every Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel --out-dir dist
      - run: uvx abi3audit --strict --verbose dist/*.whl
      - name: Run the suite on every supported Python
        run: |
          set -euo pipefail
          for version in 3.10 3.11 3.12 3.13 3.14; do
            echo "::group::Python $version"
            uv venv --python "$version" ".venv-$version"
            uv pip install --python ".venv-$version" --no-index --find-links dist fasti-py
            uv pip install --python ".venv-$version" pytest
            ".venv-$version/bin/python" -m pytest tests -q
            echo "::endgroup::"
          done

  # The stable ABI does not cover free-threaded builds until abi3t
  # (PEP 803, CPython 3.15), so those get their own wheel — and their own
  # job, since a module declared free-thread-safe should be run that way.
  python-free-threaded:
    name: python bindings (free-threaded 3.14t)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.14t .venv-ft
      - run: uv pip install --python .venv-ft . pytest
      - run: .venv-ft/bin/python -m pytest tests -q
