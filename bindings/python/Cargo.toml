[package]
name = "fasti-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
publish = false

[workspace]

[lib]
name = "_fasti"
crate-type = ["cdylib"]

[dependencies]
fasti = { path = "../.." }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
