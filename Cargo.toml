[package]
name = "fasti"
description = "Dates, calendars, business-day conventions and day-count fractions for financial code. Native Rust, no_std, float-free; designed after QuantLib's ql/time."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hugof38/fasti"
readme = "README.md"
keywords = ["date", "calendar", "business-day", "day-count", "no-std"]
categories = ["date-and-time", "finance", "no-std"]
authors = ["fasti contributors"]
# The Python bindings live in the same repository but ship on PyPI, not
# inside the crate. They are their own cargo workspace; see
# bindings/python.
exclude = ["/bindings"]

[features]
default = []
serde = ["dep:serde"]
# Opt-in interop with the chrono ecosystem: From/TryFrom conversions
# between fasti's Date/Weekday/Month and chrono's. fasti never uses
# chrono internally — the custom serial-date representation stays.
chrono = ["dep:chrono"]

[dependencies]
# Intentionally minimal: no required date deps, no I/O. The custom
# serial-date representation is deliberate; see ARCHITECTURE.md.
thiserror = { version = "2", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }
chrono = { version = "0.4", optional = true, default-features = false }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
proptest = "1"
# Only to round-trip the `serde` feature in tests/public_api.rs; never a
# runtime dependency, and the crate itself is format-agnostic.
serde_json = "1"

# Lints mirror the conventions the crate was written under: pedantic clippy,
# no panicking constructs in library code, and no float arithmetic anywhere —
# day-count math is integer-rational by design.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
float_arithmetic = "deny"
