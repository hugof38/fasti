[package]
name = "fasti"
description = "Dates, calendars, business-day conventions, and day-count fractions for financial code. A no_std Rust successor to QuantLib's ql/time."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hugof38/fasti"
readme = "README.md"
keywords = ["date", "calendar", "business-day", "day-count", "no-std"]
categories = ["date-and-time", "finance", "no-std"]
authors = ["fasti contributors"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
# Intentionally minimal: no chrono, no time, no I/O. The custom serial-date
# representation is deliberate; see ARCHITECTURE.md.
thiserror = { version = "2", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
proptest = "1"

# Lints mirror the conventions the crate was written under: pedantic clippy,
# no panicking constructs in library code, and no float arithmetic anywhere —
# day-count math is integer-rational by design.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
float_arithmetic = "deny"
